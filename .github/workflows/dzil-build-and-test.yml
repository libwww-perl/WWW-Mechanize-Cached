---
name: test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-job:
    name: Lint with precious
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set Up Perl
        uses: shogo82148/actions-setup-perl@v1.41.0
        with:
          perl-version: "5.36"
      - name: Install precious and omegasort via ubi
        uses: oalders/install-ubi-action@v0.0.6
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          projects: |
            houseabsolute/precious
            houseabsolute/omegasort
      - name: Install Perl lint tools
        uses: perl-actions/install-with-cpm@v2
        with:
          install: |
            App::perlvars
            Perl::Tidy
      - name: Run precious lint
        run: precious lint --all
  build-job:
    name: Build distribution
    runs-on: ubuntu-latest
    container:
      image: perldocker/perl-tester:5.42
    steps:
      - uses: actions/checkout@v6
      - name: Run Tests
        env:
          AUTHOR_TESTING: 1
          AUTOMATED_TESTING: 1
          EXTENDED_TESTING: 1
          RELEASE_TESTING: 1
        run: auto-build-and-test-dist
      - uses: actions/upload-artifact@v7
        with:
          name: build_dir
          path: build_dir
  coverage-job:
    needs: build-job
    runs-on: ubuntu-latest
    container:
      image: perldocker/perl-tester:5.42
    steps:
      - uses: actions/checkout@v6 # codecov wants to be inside a Git repository
      - uses: actions/download-artifact@v8
        with:
          name: build_dir
          path: .
      - name: Install deps and test
        run: cpan-install-dist-deps && test-dist
        env:
          CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}
  test-job:
    needs: build-job
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        perl-version:
          - "5.12"
          - "5.14"
          - "5.16"
          - "5.18"
          - "5.20"
          - "5.22"
          - "5.24"
          - "5.26"
          - "5.28"
          - "5.30"
          - "5.32"
          - "5.34"
          - "5.36"
          - "5.38"
          - "5.40"
          - "5.42"
        exclude:
          - os: macos-latest
            perl-version: "5.12"
          - os: macos-latest
            perl-version: "5.14"
          - os: macos-latest
            perl-version: "5.16"
          - os: macos-latest
            perl-version: "5.18"
          - os: macos-latest
            perl-version: "5.20"
          - os: macos-latest
            perl-version: "5.22"
          - os: windows-latest
            perl-version: "5.12"
          - os: windows-latest
            perl-version: "5.14"
          - os: windows-latest
            perl-version: "5.16"
          - os: windows-latest
            perl-version: "5.18"
          - os: windows-latest
            perl-version: "5.20"
          - os: windows-latest
            perl-version: "5.22"
          - os: windows-latest
            perl-version: "5.24"
          - os: windows-latest
            perl-version: "5.26"
          - os: windows-latest
            perl-version: "5.32"
          - os: windows-latest
            perl-version: "5.34"
          - os: windows-latest
            perl-version: "5.36"
    name: Perl ${{ matrix.perl-version }} on ${{ matrix.os }}
    steps:
      - name: Set Up Perl
        uses: shogo82148/actions-setup-perl@v1.41.0
        with:
          perl-version: ${{ matrix.perl-version }}
          distribution: strawberry # this option only used on Windows
      - uses: actions/download-artifact@v8
        with:
          name: build_dir
          path: .
      - name: install deps using cpm
        uses: perl-actions/install-with-cpm@v2
        with:
          cpanfile: "cpanfile"
          args: "--with-suggests --with-recommends --with-test"
          # App::cpm v0.999.0+ requires Perl 5.24+; pin older Perls to the last compatible release.
          version: ${{ matrix.perl-version <= '5.22' && '0.998003' || 'main' }}
      - run: prove -l t xt
        env:
          AUTHOR_TESTING: 1
          RELEASE_TESTING: 1
